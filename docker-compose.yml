version: '3.8'

services:
  simplifyqa-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: simplifyqa-license-management
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_ENV=qa
    restart: unless-stopped
    networks:
      - simplifyqa-network
    volumes:
      - ./logs:/var/log/nginx
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simplifyqa.rule=Host(`simplifyqa.local`)"
      - "traefik.http.services.simplifyqa.loadbalancer.server.port=80"

  # Development service (optional)
  simplifyqa-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: simplifyqa-dev
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:4001
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - simplifyqa-network
    profiles:
      - dev

networks:
  simplifyqa-network:
    driver: bridge

volumes:
  node_modules: 